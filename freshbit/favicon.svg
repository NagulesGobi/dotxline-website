<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- FreshBit app icon. Background: the website dock tile (black, violet glow from below).
       Leaf and bit: the original Icon Composer layers (logos/export/FreshBit.icon), unchanged. -->
