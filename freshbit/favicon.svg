    <clipPath id="t"><rect width="1024" height="1024" rx="320"/></clipPath>
    <radialGradient id="g1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(204.8 1075.2) scale(819.2 921.6)">
      <stop offset="0" stop-color="#4B1FFF"/><stop offset=".7" stop-color="#4B1FFF" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(921.6 1024) scale(716.8 819.2)">
